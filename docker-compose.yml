services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: personal-assistant-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage: